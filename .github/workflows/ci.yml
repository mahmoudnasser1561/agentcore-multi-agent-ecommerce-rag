name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - name: Import smoke check (no AWS credentials needed)
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: us-east-1
        run: uv run python -c "import sys; sys.path.insert(0, 'src'); import agent_orchestrator; agent_orchestrator.build_agent_graph(); print('agent graph builds cleanly')"
