<svg viewBox="0 0 1120 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NovaMart multi-agent architecture: a customer request is routed by one Orchestrator to four specialist agents, all sharing one optimistic-locked DynamoDB record and running behind one Bedrock Guardrail; the Policy agent alone fans out to three knowledge bases in parallel.">
<title>NovaMart multi-agent system — architecture overview</title>
<style>
  svg { max-width: 100%; height: auto; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  :root {
    --bg: #ffffff;
    --ink: #1a202c;
    --muted: #6b7280;
    --line: #475569;
    --card-fill: #f8fafc;
    --card-stroke: #334155;
    --hub-fill: #fff7ed;
    --hub-stroke: #c2410c;
    --hub-ink: #9a3412;
    --rag-fill: #eff6ff;
    --rag-stroke: #1d4ed8;
    --rag-ink: #1e40af;
    --boundary-stroke: #94a3b8;
    --data-fill: #f8fafc;
    --data-stroke: #334155;
    --unit-fill: #e2e8f0;
    --unit-stroke: #475569;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --ink: #e6edf3;
      --muted: #9aa5b1;
      --line: #c9d1d9;
      --card-fill: #161b22;
      --card-stroke: #8b949e;
      --hub-fill: #2a1a0f;
      --hub-stroke: #fb923c;
      --hub-ink: #fdba74;
      --rag-fill: #0f1b2e;
      --rag-stroke: #60a5fa;
      --rag-ink: #93c5fd;
      --boundary-stroke: #4b5563;
      --data-fill: #161b22;
      --data-stroke: #8b949e;
      --unit-fill: #30363d;
      --unit-stroke: #c9d1d9;
    }
  }
  .bg-rect { fill: var(--bg); }
  .card { fill: var(--card-fill); stroke: var(--card-stroke); stroke-width: 1.5; }
  .hub { fill: var(--hub-fill); stroke: var(--hub-stroke); stroke-width: 2; }
  .rag { fill: var(--rag-fill); stroke: var(--rag-stroke); stroke-width: 1.5; }
  .data { fill: var(--data-fill); stroke: var(--data-stroke); stroke-width: 1.5; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; text-anchor: middle; }
  .hub-title { fill: var(--hub-ink); font-size: 17px; font-weight: 700; text-anchor: middle; }
  .rag-title { fill: var(--rag-ink); font-size: 14.5px; font-weight: 700; text-anchor: middle; }
  .sub { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .edge-dashed { stroke: var(--muted); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  .label { fill: var(--ink); font-size: 11px; text-anchor: middle; }
  .boundary { fill: none; stroke: var(--boundary-stroke); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .boundary-label { fill: var(--muted); font-size: 12px; font-style: italic; }
  .unit { fill: var(--unit-fill); stroke: var(--unit-stroke); stroke-width: 1.2; }
  #arrow path { fill: var(--line); }
</style>
<rect class="bg-rect" width="1120" height="720"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z"/>
  </marker>
</defs>

<!-- Guardrail boundary around every agent -->
<rect class="boundary" x="195" y="45" width="665" height="440" rx="20"/>
<text class="boundary-label" x="215" y="35">Bedrock Guardrail — attached to every agent's model</text>

<!-- Customer -->
<rect class="card" x="20" y="240" width="130" height="90" rx="12"/>
<text class="title" x="85" y="278">Customer</text>
<text class="sub" x="85" y="295">chat request</text>

<!-- Orchestrator (hub) -->
<rect class="hub" x="265" y="210" width="190" height="150" rx="16"/>
<text class="hub-title" x="360" y="250">Orchestrator</text>
<text class="sub" x="360" y="271">routes every request</text>
<text class="sub" x="360" y="287">owns WorkflowState</text>
<text class="sub" x="360" y="303">(fast routing model)</text>
<text class="sub" x="360" y="327">1 of 5 agents, all on Amazon Bedrock</text>

<!-- Inventory -->
<rect class="card" x="545" y="80" width="160" height="90" rx="12"/>
<text class="title" x="625" y="113">Inventory</text>
<text class="sub" x="625" y="130">order &amp; customer facts</text>
<text class="sub" x="625" y="145">(DynamoDB lookups)</text>

<!-- Refund -->
<rect class="card" x="755" y="80" width="160" height="90" rx="12"/>
<text class="title" x="835" y="113">Refund</text>
<text class="sub" x="835" y="130">eligibility decision</text>
<text class="sub" x="835" y="145">&amp; return processing</text>

<!-- Policy (RAG highlight) -->
<rect class="rag" x="545" y="360" width="160" height="90" rx="12"/>
<text class="rag-title" x="625" y="396">Policy</text>
<text class="sub" x="625" y="414">multi-agent RAG</text>
<text class="sub" x="625" y="429">coordinator</text>

<!-- Communication -->
<rect class="card" x="755" y="360" width="160" height="90" rx="12"/>
<text class="title" x="835" y="396">Communication</text>
<text class="sub" x="835" y="414">drafts the one reply</text>
<text class="sub" x="835" y="429">the customer sees</text>

<!-- 3 Knowledge Bases cluster (outside guardrail - not a model) -->
<rect class="rag" x="945" y="345" width="155" height="120" rx="12"/>
<text class="rag-title" x="1022" y="372">3 Knowledge</text>
<text class="rag-title" x="1022" y="388">Bases</text>
<g transform="translate(970,400)">
  <rect class="unit" x="0" y="0" width="28" height="22" rx="5"/>
  <rect class="unit" x="38" y="0" width="28" height="22" rx="5"/>
  <rect class="unit" x="76" y="0" width="28" height="22" rx="5"/>
</g>
<text class="sub" x="1022" y="443">returns · shipping</text>
<text class="sub" x="1022" y="456">warranty</text>

<!-- Shared data store (outside the guardrail - a data store, not a model) -->
<rect class="data" x="190" y="565" width="340" height="95" rx="14"/>
<text class="title" x="360" y="598">DynamoDB — shared WorkflowState</text>
<text class="sub" x="360" y="616">one record per session, written after every agent runs</text>
<text class="sub" x="360" y="631">optimistic locking: version must match, or retry</text>

<!-- Edges: Customer <-> Orchestrator -->
<polyline class="edge" points="150,282 265,282" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text class="label" x="207" y="272">request / reply</text>

<!-- Edges: Orchestrator -> 4 workers, each its own clean bend column -->
<polyline class="edge" points="455,235 490,235 490,125 545,125" marker-end="url(#arrow)"/>
<polyline class="edge" points="455,260 730,260 730,125 755,125" marker-end="url(#arrow)"/>
<polyline class="edge" points="455,310 510,310 510,405 545,405" marker-end="url(#arrow)"/>
<polyline class="edge" points="455,335 750,335 750,405 755,405" marker-end="url(#arrow)"/>

<!-- Policy -> 3 Knowledge Bases (routed above row 2, clear of the Communication card) -->
<polyline class="edge" points="625,360 625,225 1022,225 1022,345" marker-end="url(#arrow)"/>
<text class="label" x="860" y="215">parallel query ×3</text>

<!-- Dashed: shared WorkflowState, owned by the Orchestrator -->
<polyline class="edge-dashed" points="360,360 360,565"/>

</svg>
